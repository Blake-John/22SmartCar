controller_manager:
  ros__parameters:
    update_rate: 50

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    ackermann_steering_controller:
      type: ackermann_steering_controller/AckermannSteeringController

ackermann_steering_controller:
  ros__parameters:
    front_steering: true
    
    front_wheels_names:
      - front_left_steering_joint
      - front_right_steering_joint
    rear_wheels_names:
      - rear_left_wheel_joint
      - rear_right_wheel_joint
    
    front_wheel_track: 0.18 
    rear_wheel_track: 0.18

    front_wheels_radius: 0.05
    rear_wheels_radius: 0.05

    # 阿克曼几何参数
    wheelbase: 0.28
    traction_track_width: 0.18
    steering_track_width: 0.18
    traction_wheels_radius: 0.05

    # 转向限位
    steering_limit_lower: -0.5236
    steering_limit_upper: 0.5236

    # 速度限制
    linear_velocity_limit: 1.0
    angular_velocity_limit: 2.0

    # 里程计
    publish_rate: 50.0
    enable_odom_tf: true
    base_frame_id: base_footprint
    odom_frame_id: odom

    cmd_vel_timeout: 0.5