# M0-4 示例任务配置（5~8 个任务）
# 字段说明：
#   name         任务名（唯一）
#   duration     预期耗时（秒），程序应 sleep(duration) 模拟执行
#   success_rate 模拟成功率，0.0 ~ 1.0
#   dependencies 前置任务名列表，必须全部先完成
#
# 现场考核会换成一份全新的 yaml/json（含新的依赖关系与参数）

timeout: 15

tasks:
  - name: Init
    duration: 0.5
    success_rate: 1.0
    dependencies: []

  - name: Navigate
    duration: 2.5
    success_rate: 0.8
    dependencies: ["Init"]

  - name: DetectQR
    duration: 1.5
    success_rate: 0.7
    dependencies: ["Navigate"]

  - name: Grasp
    duration: 1.0
    success_rate: 0.9
    dependencies: ["DetectQR"]

  - name: AvoidObstacle
    duration: 2.0
    success_rate: 0.6
    dependencies: ["Navigate"]

  - name: Place
    duration: 1.0
    success_rate: 0.85
    dependencies: ["Grasp", "AvoidObstacle"]

  - name: ReturnHome
    duration: 2.5
    success_rate: 0.95
    dependencies: ["Place"]
